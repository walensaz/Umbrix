# ===============================================================================
# Umbrix Gradle Daemon & Java Toolchain Strategy (Item 6.1)
# ===============================================================================
# 1. Gradle Daemon JVM:
#    The Gradle build daemon runs on Java 21 LTS (Azul 21.0.5) to ensure compatibility
#    with Gradle 8.12, Kotlin Gradle Plugin 2.1.10, and Compose Desktop 1.7.3 plugins.
#
# 2. Compilation & Runtime Toolchain:
#    All Umbrix subprojects (Scala 3, Kotlin, Java) compile and test strictly against
#    Azul OpenJDK 25 LTS via Java Toolchains (languageVersion = 25) declared in
#    root build.gradle.kts. This provides zero-heap FFM (JEP 454) and Vector SIMD.
#
# 3. Kotlin Target Compatibility:
#    Kotlin modules compile on the JDK 25 toolchain but emit JVM 21 bytecode
#    (JvmTarget.JVM_21) for maximum compatibility with Compose Desktop / Skiko native
#    libraries. Toolchain target validation is suppressed via kotlin.jvm.target.validation.mode=ignore.
# ===============================================================================

# Set org.gradle.java.home in ~/.gradle/gradle.properties or export JAVA_HOME
# org.gradle.java.home=/path/to/jdk-21

# JVM arguments for Gradle Daemon with Foreign Function & Memory and Vector API
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC --enable-native-access=ALL-UNNAMED --add-modules=jdk.incubator.vector

# Performance & Caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin Daemon & Toolchain Validation
kotlin.daemon.jvmargs=-Xmx2g
kotlin.jvm.target.validation.mode=ignore
